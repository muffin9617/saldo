name: Deploy Saldo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          python3 - <<'PY'
          import html
          import json
          from pathlib import Path

          root = Path("dist")
          headers = root / "_headers"
          csp = next(line.split(": ", 1)[1] for line in headers.read_text().splitlines()
                     if line.strip().startswith("Content-Security-Policy:"))
          # Browsers accept the policy below in HTML. Frame restrictions require a response header.
          csp = "; ".join(d.strip() for d in csp.split(";")
                          if not d.strip().startswith("frame-ancestors "))
          index = root / "index.html"
          meta = f'<meta http-equiv="Content-Security-Policy" content="{html.escape(csp, quote=True)}">'
          meta += '<meta name="referrer" content="no-referrer">'
          page = index.read_text().replace("<head>", "<head>" + meta, 1)
          index.write_text(page.replace('href="/', 'href="./').replace('src="/', 'src="./'))
          manifest = root / "manifest.webmanifest"
          data = json.loads(manifest.read_text())
          for field in ("start_url", "scope", "id"):
              data[field] = "./"
          for icon in data["icons"]:
              icon["src"] = "./" + icon["src"].lstrip("/")
          manifest.write_text(json.dumps(data, ensure_ascii=False))
          headers.unlink()
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
