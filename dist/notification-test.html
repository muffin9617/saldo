<body><div id="preview-note" hidden>本地交互预览 · 不申请设备权限，不发送通知</div><main><a class="brand" href="/">Saldo</a><section><p class="eyebrow">通知连接测试</p><h1>让提醒准时抵达</h1><p class="intro">先连接这台设备，再验收到期提醒。</p><p id="status" role="status" aria-live="polite">正在检查通知设置…</p><ol><li><strong>从主屏幕打开</strong><p>iPhone：Safari 分享 → 添加到主屏幕。Android：浏览器菜单 → 安装应用或添加到主屏幕。</p></li><li><strong>允许这台设备接收通知</strong><p>点击下方按钮，在系统弹窗中选择允许。</p></li><li><strong>检查通知显示</strong><p>先检查系统通知能否显示；后台推送与到期邮件将单独验收。</p></li></ol><div class="actions"><a id="login" class="button" href="/" hidden>返回 Saldo 登录</a><button id="enable" disabled>连接这台设备</button><button id="display" class="secondary" disabled>测试系统通知显示</button><button id="recheck" class="text">重新检查</button></div><p id="result" role="status" aria-live="polite"></p><p class="footnote">每日自动提醒保持关闭。连接成功不代表后台到期提醒已启用。</p></section></main><script defer src="/vendor/supabase-2.119.0.js"></script><script type="module" src="/notification-test.js"></script></body></html>
