<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saldo · 品牌邮件预览</title><link rel="stylesheet" href="/preview.css"></head>
<body><header><div><a class="brand" href="http://127.0.0.1:4174/">Saldo</a><span class="eyebrow">品牌邮件预览</span></div><p>本地设计稿 · 虚构示例 · 不会发送邮件</p></header>
<main><div class="controls"><div class="switch" role="group" aria-label="邮件类型"><button data-email="confirmation" aria-pressed="true">M01 注册验证</button><button data-email="M02" aria-pressed="false">M02 重置密码</button><button data-email="M03" aria-pressed="false">M03 密码已更新</button><button data-email="reminder" aria-pressed="false">M14 到期提醒</button></div><div class="switch" role="group" aria-label="预览尺寸"><button data-width="desktop" aria-pressed="true">桌面</button><button data-width="mobile" aria-pressed="false">手机</button></div><div class="switch" role="group" aria-label="显示模式"><button data-theme="light" aria-pressed="true">暖米色</button><button data-theme="dark" aria-pressed="false">深色模式</button></div></div>
<label>条件邮件预览 <select id="other-templates"><option value="">选择 M04–M13（不代表线上启用）</option></select></label>
<div class="mail-meta"><div class="avatar">S</div><div><strong>Saldo</strong><span>noreply@saldo.tobmarket.ing</span><p id="subject"></p><small id="preheader"></small></div></div>
<div class="copy-tools"><button id="copy-subject" type="button">复制主题</button><button id="copy-html" type="button">复制 Supabase HTML</button><span id="copy-status" role="status" aria-live="polite"></span><textarea id="copy-fallback" aria-label="待复制的邮件源码" readonly hidden></textarea></div>
<div class="stage"><iframe id="email-frame" title="注册验证邮件预览" sandbox="allow-same-origin"></iframe></div>
<div class="review-note"><strong>检查边界情况</strong><label><input type="checkbox" id="stress"> 极长名称与大额费用</label><label><input type="checkbox" id="images"> 隐藏图片</label><label><input type="checkbox" id="renewal"> 已标记自动续约</label><label><input type="checkbox" id="today"> 到期当天、未填费用与续约状态</label></div>
<p class="note">这里检查版式与信息层级。最终仍需在 Gmail、Apple Mail 和 Outlook 中验收；预览按钮不会进行注册或打开真实订阅。</p></main><script type="module" src="/preview.js"></script></body></html>
